<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BBTG Nieuws — System Architecture</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Syne:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      /* ── Design tokens — dark (default) ── */
      :root {
        --bg: #0f1115;
        --surface: rgba(255, 255, 255, 0.02);
        --surface-alt: rgba(255, 255, 255, 0.03);
        --border: rgba(255, 255, 255, 0.28);
        --border-subtle: rgba(255, 255, 255, 0.18);
        --border-faint: rgba(255, 255, 255, 0.12);
        --text: #ffffff;
        --text-muted: rgba(255, 255, 255, 0.45);
        --text-dim: rgba(255, 255, 255, 0.6);
        --text-faint: rgba(255, 255, 255, 0.18);
        --img-opacity: 0.45;
        --img-filter: grayscale(30%);
        --dot-idle: rgba(255, 255, 255, 0.1);
        --dot-done: rgba(255, 255, 255, 0.3);
        --node-glow-bg: rgba(15, 17, 21, 0.95);
        --edge-idle: rgba(255, 255, 255, 0.22);
        --scrollbar: rgba(255, 255, 255, 0.1);
        --active-text: #0f1115;
        --logo-filter: none;
        --box-bg: rgba(255, 255, 255, 0.04);
      }

      /* ── Design tokens — light ── */
      .light {
        --bg: #f0f2f5;
        --surface: rgba(0, 0, 0, 0.02);
        --surface-alt: rgba(0, 0, 0, 0.03);
        --border: rgba(0, 0, 0, 0.28);
        --border-subtle: rgba(0, 0, 0, 0.2);
        --border-faint: rgba(0, 0, 0, 0.14);
        --text: #0f1115;
        --text-muted: rgba(0, 0, 0, 0.5);
        --text-dim: rgba(0, 0, 0, 0.55);
        --text-faint: rgba(0, 0, 0, 0.25);
        --img-opacity: 0.7;
        --img-filter: none;
        --dot-idle: rgba(0, 0, 0, 0.12);
        --dot-done: rgba(0, 0, 0, 0.3);
        --node-glow-bg: rgba(255, 255, 255, 0.95);
        --edge-idle: rgba(0, 0, 0, 0.22);
        --scrollbar: rgba(0, 0, 0, 0.12);
        --active-text: #ffffff;
        --logo-filter: none;
        --box-bg: rgba(0, 0, 0, 0.04);
      }

      body {
        background: var(--bg);
        color: var(--text);
        font-family:
          "Syne",
          system-ui,
          -apple-system,
          sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        height: 100dvh;
        overflow: hidden;
        padding: 10px 16px 10px;
        transition:
          background 0.3s,
          color 0.3s;
      }

      .header {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 8px;
      }
      .header img {
        height: 30px;
        filter: var(--logo-filter);
      }
      .header h1 {
        font-size: 1.5rem;
        font-weight: 800;
        letter-spacing: -0.02em;
      }

      .subtitle {
        display: none;
      }

      /* ── Theme toggle ── */
      .theme-toggle {
        margin-left: 8px;
        width: 44px;
        height: 24px;
        border-radius: 12px;
        border: 1.5px solid var(--border);
        background: var(--surface-alt);
        cursor: pointer;
        position: relative;
        transition:
          background 0.25s,
          border-color 0.25s;
        flex-shrink: 0;
      }
      .theme-toggle::after {
        content: "";
        position: absolute;
        top: 3px;
        left: 3px;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: var(--text-muted);
        transition:
          transform 0.25s,
          background 0.25s;
      }
      .light .theme-toggle::after {
        transform: translateX(20px);
        background: var(--text-muted);
      }
      .theme-toggle-icon {
        position: absolute;
        font-size: 0.65rem;
        top: 50%;
        transform: translateY(-50%);
        pointer-events: none;
        line-height: 1;
      }
      .theme-toggle-icon.moon {
        left: 5px;
      }
      .theme-toggle-icon.sun {
        right: 5px;
      }

      .controls {
        display: flex;
        gap: 10px;
        margin-bottom: 6px;
      }

      .flow-btn {
        padding: 9px 26px;
        border: 2px solid var(--btn-color);
        border-radius: 12px;
        background: transparent;
        color: var(--btn-color);
        font-family: "Syne", system-ui, sans-serif;
        font-size: 0.95rem;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.22s ease;
        user-select: none;
      }
      .flow-btn:hover {
        background: color-mix(in srgb, var(--btn-color) 12%, transparent);
        transform: translateY(-1px);
      }
      .flow-btn.active {
        background: var(--btn-color);
        color: var(--active-text);
        box-shadow: 0 0 20px
          color-mix(in srgb, var(--btn-color) 40%, transparent);
      }
      .flow-btn.polling {
        --btn-color: #e05e00;
      }
      .flow-btn.sse {
        --btn-color: #1fa855;
      }
      .flow-btn.websocket {
        --btn-color: #1a7cc2;
      }

      .flow-desc {
        font-size: 0.82rem;
        color: var(--text-dim);
        font-family: "JetBrains Mono", monospace;
        min-height: 1.3em;
        margin-bottom: 5px;
        text-align: center;
      }

      .progress-dots {
        display: flex;
        gap: 5px;
        justify-content: center;
        margin-bottom: 8px;
        min-height: 10px;
      }
      .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--dot-idle);
        transition:
          background 0.3s,
          transform 0.2s;
      }
      .dot.done {
        background: var(--dot-color, var(--dot-done));
      }
      .dot.current {
        background: var(--dot-color, var(--text));
        transform: scale(1.5);
      }

      /* ── Main area ── */
      .main-row {
        display: flex;
        gap: 14px;
        align-items: flex-start;
        flex: 1;
        min-height: 0;
        width: 100%;
        max-width: 1560px;
      }

      /* ── Diagram ── */
      .diagram {
        position: relative;
        flex: 1;
        min-width: 0;
        height: 100%;
        border-radius: 18px;
        border: 1px solid var(--border);
        background: var(--surface);
        transition:
          background 0.3s,
          border-color 0.3s;
      }
      .diagram.flow-active {
        cursor: pointer;
      }

      .diagram-inner {
        position: absolute;
        width: 1160px;
        height: 720px;
        transform-origin: top left;
      }

      .diagram-svg {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 1;
      }

      /* ── Nodes ── */
      .node {
        position: absolute;
        transform: translate(-50%, -50%);
        width: 160px;
        height: 82px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 3px;
        border: 1.5px solid var(--border-subtle);
        border-radius: 12px;
        background: var(--surface-alt);
        color: var(--text-muted);
        transition: all 0.35s ease;
        z-index: 2;
        user-select: none;
      }
      .node img {
        width: 30px;
        height: 30px;
        object-fit: contain;
        opacity: var(--img-opacity);
        transition:
          opacity 0.35s ease,
          filter 0.35s ease;
        filter: var(--img-filter);
      }
      .node .node-label {
        margin-top: 5px;
        font-size: 0.95rem;
        white-space: nowrap;
      }
      .node .node-sublabel {
        font-size: 0.75rem;
        color: var(--text-dim);
      }

      .node.browser-node {
        width: 150px;
        height: 72px;
      }
      .node.browser-node .node-ico {
        font-size: 1.6rem;
        line-height: 25px;
      }
      .node.browser-node .node-role {
        font-size: 0.75rem;
        color: var(--text-dim);
      }

      .node.glow {
        border-color: var(--glow);
        color: var(--text);
        background: color-mix(in srgb, var(--glow) 10%, var(--node-glow-bg));
        box-shadow:
          0 0 24px color-mix(in srgb, var(--glow) 30%, transparent),
          inset 0 0 12px color-mix(in srgb, var(--glow) 6%, transparent);
      }
      .node.glow img {
        opacity: 1;
        filter: none;
      }

      @keyframes nodePulse {
        0% {
          box-shadow:
            0 0 24px color-mix(in srgb, var(--glow) 30%, transparent),
            inset 0 0 12px color-mix(in srgb, var(--glow) 6%, transparent);
        }
        40% {
          box-shadow:
            0 0 56px color-mix(in srgb, var(--glow) 85%, transparent),
            inset 0 0 24px color-mix(in srgb, var(--glow) 22%, transparent);
          border-color: var(--glow);
        }
        100% {
          box-shadow:
            0 0 24px color-mix(in srgb, var(--glow) 30%, transparent),
            inset 0 0 12px color-mix(in srgb, var(--glow) 6%, transparent);
        }
      }
      .node.glow.pulse {
        animation: nodePulse 0.65s ease-out;
      }

      /* ── Edges ── */
      .edge {
        stroke: var(--edge-idle);
        stroke-width: 1.5;
        fill: none;
        transition:
          stroke 0.35s ease,
          stroke-width 0.35s ease,
          filter 0.35s ease;
      }
      .edge.glow {
        stroke: var(--glow);
        stroke-width: 2.5;
        filter: drop-shadow(0 0 4px var(--glow));
      }
      @keyframes edgePulse {
        0% {
          stroke-width: 2.5;
          filter: drop-shadow(0 0 4px var(--glow));
        }
        40% {
          stroke-width: 6;
          filter: drop-shadow(0 0 12px var(--glow));
        }
        100% {
          stroke-width: 2.5;
          filter: drop-shadow(0 0 4px var(--glow));
        }
      }
      .edge.glow.pulse {
        animation: edgePulse 0.65s ease-out;
      }

      /* ── Boundary rectangles ── */
      .boundary-rect {
        fill: var(--box-bg);
        stroke: var(--border);
        stroke-width: 1;
        stroke-dasharray: 6 4;
      }
      .boundary-label {
        position: absolute;
        font-size: 0.8rem;
        font-weight: 700;
        color: var(--text-dim);
        letter-spacing: 0.16em;
        text-transform: uppercase;
        font-family: "JetBrains Mono", monospace;
        z-index: 2;
      }

      /* ── Event label (shown below EventBridge during flows) ── */
      .event-label {
        position: absolute;
        font-family: "JetBrains Mono", monospace;
        font-size: 0.72rem;
        font-weight: 600;
        padding: 3px 10px;
        border-radius: 6px;
        white-space: nowrap;
        pointer-events: none;
        z-index: 10;
        opacity: 0;
        transition: opacity 0.25s;
        background: color-mix(in srgb, var(--glow) 18%, var(--bg));
        border: 1px solid color-mix(in srgb, var(--glow) 50%, transparent);
        color: var(--glow);
      }
      .event-label.visible {
        opacity: 1;
      }

      /* ── Hints ── */
      .diagram-hints {
        position: absolute;
        bottom: 12px;
        right: 14px;
        font-family: "JetBrains Mono", monospace;
        font-size: 0.72rem;
        color: var(--text-faint);
        z-index: 10;
        pointer-events: none;
        text-align: right;
        line-height: 1.6;
        transition: opacity 0.3s;
      }

      .step-counter {
        position: absolute;
        top: 12px;
        right: 14px;
        font-family: "JetBrains Mono", monospace;
        font-size: 0.72rem;
        color: var(--text-faint);
        z-index: 10;
        pointer-events: none;
      }

      /* ── Log panel ── */
      .log-panel {
        width: 340px;
        flex-shrink: 0;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 14px;
        height: 100%;
        display: flex;
        flex-direction: column;
        transition:
          background 0.3s,
          border-color 0.3s;
      }
      .log-panel-header {
        font-size: 0.8rem;
        font-weight: 700;
        color: var(--text-dim);
        letter-spacing: 0.14em;
        text-transform: uppercase;
        font-family: "JetBrains Mono", monospace;
        padding-bottom: 10px;
        border-bottom: 1px solid var(--border);
        margin-bottom: 10px;
        flex-shrink: 0;
      }
      .log-entries {
        flex: 1;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .log-entries::-webkit-scrollbar {
        width: 4px;
      }
      .log-entries::-webkit-scrollbar-track {
        background: transparent;
      }
      .log-entries::-webkit-scrollbar-thumb {
        background: var(--scrollbar);
        border-radius: 2px;
      }
      .log-entry {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        padding: 9px 10px;
        border-radius: 8px;
        background: var(--surface-alt);
        border: 1px solid var(--border-faint);
        animation: fadeIn 0.25s ease;
      }
      .log-entry.current {
        background: color-mix(in srgb, var(--glow) 8%, var(--surface-alt));
        border-color: color-mix(in srgb, var(--glow) 25%, transparent);
      }
      .log-entry.past {
        opacity: 0.6;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(4px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .log-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        flex-shrink: 0;
        margin-top: 4px;
        background: var(--glow, var(--text-dim));
      }
      .log-text {
        font-size: 0.97rem;
        line-height: 1.45;
        color: var(--text);
      }
      .log-empty {
        font-size: 0.78rem;
        color: var(--text-dim);
        font-family: "JetBrains Mono", monospace;
        text-align: center;
        margin-top: 20px;
      }

      /* ── Legend ── */
      .legend {
        margin-top: 16px;
        display: flex;
        gap: 24px;
        font-size: 0.68rem;
        color: var(--text-dim);
        font-family: "JetBrains Mono", monospace;
      }
      .legend-item {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .legend-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        display: inline-block;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <img
        src="https://bbtg.com/assets/bbtg-logo-550x190-f846a0b3.png"
        alt="BBTG"
      />
      <h2>Systeemarchitectuur</h2>
      <button
        class="theme-toggle"
        id="themeToggle"
        title="Toggle light/dark mode"
        onclick="toggleTheme()"
      >
        <span class="theme-toggle-icon moon">🌙</span>
        <span class="theme-toggle-icon sun">☀️</span>
      </button>
    </div>

    <div class="controls">
      <button class="flow-btn polling" onclick="startFlow('polling')">
        Polling
      </button>
      <button class="flow-btn sse" onclick="startFlow('sse')">
        Server-Sent Events
      </button>
      <button class="flow-btn websocket" onclick="startFlow('websocket')">
        WebSockets
      </button>
    </div>
    <p class="flow-desc" id="flowDesc">&nbsp;</p>
    <div class="progress-dots" id="progressDots"></div>

    <div class="main-row">
      <div class="diagram" id="diagram">
        <div class="diagram-inner" id="diagramInner">
          <svg class="diagram-svg" id="svg"></svg>
        </div>
        <div class="step-counter" id="stepCounter"></div>
        <div class="diagram-hints" id="diagHints" style="opacity: 0">
          Spatie / → &nbsp;volgende stap<br />
          ← &nbsp;vorige stap<br />
          Esc &nbsp;reset
        </div>
      </div>

      <div class="log-panel">
        <div class="log-panel-header">Stap log</div>
        <div class="log-entries" id="logEntries">
          <p class="log-empty">Selecteer een flow om te beginnen</p>
        </div>
      </div>
    </div>

    <script>
      // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      // ICONS
      // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

      const B =
        "https://cdn.jsdelivr.net/gh/awslabs/aws-icons-for-plantuml@main/dist/";
      const ICONS = {
        cloudfront: B + "NetworkingContentDelivery/CloudFront.png",
        s3: B + "Storage/SimpleStorageService.png",
        apigw: B + "NetworkingContentDelivery/APIGateway.png",
        alb:
          B +
          "NetworkingContentDelivery/ElasticLoadBalancingApplicationLoadBalancer.png",
        lambda: B + "Compute/Lambda.png",
        ecs: B + "Containers/ElasticContainerService.png",
        dynamodb: B + "Database/DynamoDB.png",
        eventbridge: B + "ApplicationIntegration/EventBridge.png",
        redis: B + "Database/ElastiCacheElastiCacheforRedis.png",
      };

      // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      // LAYOUT DATA
      // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

      const NW = 160,
        NH = 82; // node width/height — must match .node CSS dimensions

      const nodes = [
        // ── Browsers (top row) ──
        {
          id: "author",
          browser: true,
          ico: "✍️",
          label: "Author",
          x: 120,
          y: 55,
        },
        {
          id: "cloudfront",
          ico: ICONS.cloudfront,
          label: "CloudFront",
          x: 580,
          y: 55,
        },
        {
          id: "visitor",
          browser: true,
          ico: "👁",
          label: "Visitor",
          x: 1000,
          y: 55,
        },

        // ── Network layer ──
        { id: "s3", ico: ICONS.s3, label: "S3", x: 120, y: 210 },
        {
          id: "apigw",
          ico: ICONS.apigw,
          label: "API Gateway",
          x: 370,
          y: 210,
        },
        { id: "alb", ico: ICONS.alb, label: "Load Balancer", x: 1000, y: 210 },

        // ── Compute layer ──
        {
          id: "lambda-edit",
          ico: ICONS.lambda,
          label: "HTTP Lambda",
          x: 120,
          y: 380,
        },
        {
          id: "lambda-deliv",
          ico: ICONS.lambda,
          label: "HTTP Lambda",
          x: 805,
          y: 380,
        },
        {
          id: "ecs",
          ico: ICONS.ecs,
          label: "ECS",
          x: 1000,
          y: 380,
        },

        // ── Data & integration layer ──
        {
          id: "dynamo-edit",
          ico: ICONS.dynamodb,
          label: "Database",
          x: 120,
          y: 560,
        },
        {
          id: "eventbridge",
          ico: ICONS.eventbridge,
          label: "EventBridge",
          x: 370,
          y: 380,
        },
        {
          id: "consumer",
          ico: ICONS.lambda,
          label: "Consumer Lambda",
          x: 610,
          y: 380,
        },
        {
          id: "redis",
          ico: ICONS.redis,
          label: "Redis",
          x: 1000,
          y: 560,
        },
        {
          id: "dynamo-deliv",
          ico: ICONS.dynamodb,
          label: "Database",
          x: 805,
          y: 560,
        },
      ];

      function pt(id, side, offset) {
        const n = nodes.find((n) => n.id === id);
        const o = offset || 0;
        switch (side) {
          case "top":
            return [n.x + o, n.y - NH / 2];
          case "bottom":
            return [n.x + o, n.y + NH / 2];
          case "left":
            return [n.x - NW / 2, n.y + o];
          case "right":
            return [n.x + NW / 2, n.y + o];
        }
      }

      const edges = [
        // Browser ↔ CloudFront
        {
          id: "author-cf",
          from: pt("author", "right"),
          to: pt("cloudfront", "left"),
        },
        {
          id: "visitor-cf",
          from: pt("visitor", "left"),
          to: pt("cloudfront", "right"),
        },

        // CloudFront → backends
        {
          id: "cf-s3",
          from: pt("cloudfront", "bottom", -30),
          to: pt("s3", "top", 10),
        },
        {
          id: "cf-apigw",
          from: pt("cloudfront", "bottom", -10),
          to: pt("apigw", "top", 10),
        },
        {
          id: "cf-alb",
          from: pt("cloudfront", "bottom", 10),
          to: pt("alb", "top"),
        },

        // API Gateway → Editorial Lambda (writes)
        {
          id: "apigw-lambda",
          from: pt("apigw", "bottom", -5),
          to: pt("lambda-edit", "top", 10),
        },

        // API Gateway → Delivery Lambda (reads)
        {
          id: "apigw-lambda-deliv",
          from: pt("apigw", "bottom", 20),
          to: pt("lambda-deliv", "top", -10),
        },

        // Editorial Lambda → Editorial DynamoDB
        {
          id: "lambda-dynamo-edit",
          from: pt("lambda-edit", "bottom"),
          to: pt("dynamo-edit", "top"),
        },

        // Editorial Lambda → EventBridge
        {

          to: pt("eventbridge", "left"),

        {

        // Consumer → Redis (Streams for SSE, pub/sub for WS close)
        {

          from: pt("consumer", "bottom", -10),
          to: pt("redis", "bottom"),
          via: [
            [600, 615],
            [1000, 615],
          ],
        },

        // Consumer → Delivery DynamoDB (materializes read model)
        // Routed below Redis to avoid overlapping that node.
        {
          id: "consumer-dynamo-deliv",
          from: pt("consumer", "bottom"),
          to: pt("dynamo-deliv", "top", -10),
        },

        // Redis ↔ ECS (Streams for SSE, pub/sub for WS chat + close)
        {
          id: "redis-ecs",
          from: pt("redis", "top"),
          to: pt("ecs", "bottom"),
        },

        // ECS ↔ ALB
        { id: "ecs-alb", from: pt("ecs", "top"), to: pt("alb", "bottom") },

        // ECS → Delivery DynamoDB (initial blog data, chat history)
        {
          id: "ecs-dynamo-deliv",
          from: pt("ecs", "bottom", -10),
          to: pt("dynamo-deliv", "top", 10),
        },

        // Delivery Lambda → Delivery DynamoDB
        {
          id: "lambda-deliv-dynamo-deliv",
          from: pt("lambda-deliv", "bottom"),
          to: pt("dynamo-deliv", "top"),

      ];

      // ── Boundary boxes ──

      // Editorial bounded context — around Editorial Lambda + Editorial DynamoDB
      const editorialBox = { x: 18, y: 300, w: 200, h: 320, r: 14 };

      // Shared Event Bus — around EventBridge (x:370, y:380, node 160×82)
      const eventBusBox = { x: 270, y: 300, w: 200, h: 140, r: 14 };

      // Delivery bounded context — around ALB, ECS, Consumer, Redis, Delivery DynamoDB
      const deliveryBox = { x: 505, y: 155, w: 595, h: 480, r: 14 };

      // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      // FLOW COLORS & DESCRIPTIONS
      // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

      const COLORS = {
        polling: "#FF6B00",
        sse: "#2ECC71",
        websocket: "#3498DB",
      };

      const DESCS = {
        polling:
          "Auteur publiceert → event → materialisatie in delivery DB → bezoeker pollt (60s)",
        sse: "Auteur publiceert → event → Redis Stream → bezoeker ontvangt direct via SSE",
        websocket:
          "Chatberichten via WebSocket — blog sluiting via EventBridge",
      };

      // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      // FLOW STEPS
      // Each step: { nodes, edges, label, clear, pulse }
      // Nodes/edges accumulate. clear: true resets highlights before this step.
      // pulse: string[] — briefly re-animates already-highlighted elements so
      // there is a visible cue when nothing new is added to the diagram.
      // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

      const flows = {
        polling: [
          {
            nodes: ["author"],
            edges: [],
            label: "Auteur schrijft en publiceert een artikel",
          },
          {

          {
            nodes: ["lambda-edit"],
            edges: ["apigw-lambda"],
            label: "Editorial Lambda wordt aangeroepen",
          },
          {
            nodes: ["dynamo-edit"],
            edges: ["lambda-dynamo-edit"],
            label: "Artikel opgeslagen in Editorial DynamoDB",
          },
          {
            nodes: ["eventbridge"],
            edges: ["lambda-eb"],
            label: "ArticlePublished event gepubliceerd naar EventBridge",
            eventLabel: "ArticlePublished",
          },
          {

          },
          {

          {

            edges: [],

          },
          {
            nodes: ["cloudfront"],

            label: "GET /articles via CloudFront",
          },
          {
            nodes: ["apigw"],
            edges: ["cf-apigw"],
            label: "Doorgestuurd naar API Gateway",
          },
          {
            nodes: ["lambda-deliv"],
            edges: ["apigw-lambda-deliv"],
            label: "Delivery Lambda ontvangt het leesverzoek",
          },
          {
            nodes: ["dynamo-deliv"],
            edges: ["lambda-deliv-dynamo-deliv"],
            label: "Lambda leest uit Delivery DynamoDB",
          },
        ],
        sse: [
          {
            nodes: ["visitor"],
            edges: [],
            label: "Bezoeker opent live blog — SSE-verbinding wordt geopend",

          {

          {

            label:
              "SSE-verbinding geopend — ECS haalt bestaande updates op uit de Redis Streams",

          {
            nodes: ["redis"],
            edges: ["redis-ecs"],
            label:
              "Alle eerdere updates worden teruggespeeld — bezoeker ziet meteen de volledige geschiedenis",
          },
          {
            clear: true,
            nodes: ["author"],
            edges: [],
            label: "Auteur plaatst een live update",
          },
          {
            nodes: ["cloudfront"],
            edges: ["author-cf"],
            label: "Verzoek via CloudFront",
          },
          {
            nodes: ["apigw"],

            label: "POST /updates naar API Gateway",
          },
          {

          },
          {

          },
          {

              "ECS haalt chatgeschiedenis op uit DynamoDB — direct zichtbaar bij verbinden",
          },
          {
            clear: true,

            label: "Auteur verstuurt een chatbericht",
          },
          {
            nodes: ["cloudfront"],

            label: "Bericht via CloudFront",
          },
          {
            nodes: ["alb"],

            label: "ALB stuurt door naar ECS",
          },
          {

            label: "ECS ontvangt bericht via WebSocket",
          },
          {
            nodes: ["dynamo-deliv"],

            label:
              "Bericht opgeslagen in DynamoDB — history beschikbaar bij reconnect",
          },
          {
            nodes: ["redis"],
            edges: ["redis-ecs"],
            label: "ECS publiceert naar Redis pub/sub voor fan-out",
          },
          {
            nodes: [],
            edges: ["redis-ecs"],
            pulse: ["redis-ecs"],
            label: "Alle ECS-nodes ontvangen het bericht via Redis",
          },
          {

            edges: ["ecs-alb"],
            pulse: ["ecs-alb", "alb"],
            label: "Elke ECS-node stuurt het bericht door naar ALB",
          },
          {
            nodes: ["cloudfront"],
            edges: ["cf-alb"],
            pulse: ["cf-alb", "cloudfront"],
            label: "ALB stuurt door via CloudFront",
          },
          {
            nodes: ["author", "visitor"],
            edges: ["author-cf", "visitor-cf"],
            pulse: ["author", "visitor", "author-cf", "visitor-cf"],
            label: "Auteur en bezoeker zien het bericht direct",
          },
          {
            clear: true,
            nodes: ["author"],
            edges: [],
            label: "⚡ Auteur sluit het blog — BlogClosed event",
          },
          {
            nodes: ["cloudfront"],
            edges: ["author-cf"],
            label: "POST /blogs/:blogId/close via CloudFront",
          },
          {
            nodes: ["apigw"],
            edges: ["cf-apigw"],
            label: "Naar API Gateway",
          },
          {
            nodes: ["lambda-edit"],
            edges: ["apigw-lambda"],
            label: "Editorial Lambda publiceert BlogClosed event",
          },
          {
            nodes: ["eventbridge"],
            edges: ["lambda-eb"],
            label: "BlogClosed event naar EventBridge",
            eventLabel: "BlogClosed",
          },
          {
            nodes: ["consumer"],
            edges: ["eb-consumer"],
            label: "Consumer Lambda getriggerd",
            eventLabel: "BlogClosed",
          },
          {
            nodes: ["redis"],
            edges: ["consumer-redis"],
            label: "Close-signaal gepubliceerd op Redis pub/sub",
          },
          {
            nodes: ["ecs"],
            edges: ["redis-ecs"],
            label:
              "ECS ontvangt close-signaal en sluit alle WebSocket-verbindingen",
          },
          {
            nodes: ["alb"],
            edges: ["ecs-alb"],
            label:
              "WebSocket close-frame via ALB doorgestuurd naar verbonden clients",
          },
          {
            nodes: ["visitor"],
            edges: ["cf-alb", "visitor-cf"],
            label: "Bezoeker ontvangt graceful close — chat is beëindigd",
          },
        ],
      };

      // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      // RENDER: DOM
      // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

      const diagram = document.getElementById("diagram");
      const diagramInner = document.getElementById("diagramInner");
      const svg = document.getElementById("svg");
      const stepCounter = document.getElementById("stepCounter");
      const diagHints = document.getElementById("diagHints");
      const flowDesc = document.getElementById("flowDesc");
      const progressDots = document.getElementById("progressDots");
      const logEntries = document.getElementById("logEntries");

      // Scale the fixed 1160×720 inner canvas to fill the .diagram container.
      function scaleDiagram() {
        const scaleX = diagram.clientWidth / 1160;
        const scaleY = diagram.clientHeight / 720;
        const scale = Math.min(scaleX, scaleY);
        const offsetX = (diagram.clientWidth - 1160 * scale) / 2;
        const offsetY = (diagram.clientHeight - 720 * scale) / 2;
        diagramInner.style.transform = `scale(${scale})`;
        diagramInner.style.left = offsetX + "px";
        diagramInner.style.top = offsetY + "px";
      }
      scaleDiagram();
      window.addEventListener("resize", scaleDiagram);

      function toggleTheme() {
        document.body.classList.toggle("light");
      }

      const NS = "http://www.w3.org/2000/svg";

      // Draw boundary boxes
      const boundaries = [
        { box: editorialBox, label: "Editorial", labelPos: "top-left" },
        { box: eventBusBox, label: "Event Bus", labelPos: "top-left" },
        { box: deliveryBox, label: "Delivery", labelPos: "top-left" },
      ];

      for (const b of boundaries) {
        const rect = document.createElementNS(NS, "rect");
        rect.setAttribute("x", b.box.x);
        rect.setAttribute("y", b.box.y);
        rect.setAttribute("width", b.box.w);
        rect.setAttribute("height", b.box.h);
        rect.setAttribute("rx", b.box.r);
        rect.classList.add("boundary-rect");
        svg.appendChild(rect);

        const lbl = document.createElement("div");
        lbl.className = "boundary-label";
        lbl.textContent = b.label;
        if (b.labelPos === "top-right") {
          lbl.style.left = b.box.x + b.box.w - b.label.length * 8 - 10 + "px";
          lbl.style.top = b.box.y + 8 + "px";
        } else {
          lbl.style.left = b.box.x + 12 + "px";
          lbl.style.top = b.box.y + 8 + "px";
        }
        diagramInner.appendChild(lbl);
      }

      // Edges — use polyline when via waypoints are present, line otherwise
      for (const e of edges) {
        if (e.via) {
          const poly = document.createElementNS(NS, "polyline");
          const allPoints = [e.from, ...e.via, e.to];
          poly.setAttribute(
            "points",
            allPoints.map(([x, y]) => `${x},${y}`).join(" "),
          );
          poly.classList.add("edge");
          poly.id = "edge-" + e.id;
          svg.appendChild(poly);
        } else {
          const line = document.createElementNS(NS, "line");
          line.setAttribute("x1", e.from[0]);
          line.setAttribute("y1", e.from[1]);
          line.setAttribute("x2", e.to[0]);
          line.setAttribute("y2", e.to[1]);
          line.classList.add("edge");
          line.id = "edge-" + e.id;
          svg.appendChild(line);
        }
      }

      // Nodes
      for (const n of nodes) {
        const el = document.createElement("div");
        el.id = "node-" + n.id;
        el.style.left = n.x + "px";
        el.style.top = n.y + "px";

        if (n.browser) {
          el.className = "node browser-node";
          el.innerHTML = `<span class="node-ico">${n.ico}</span>
      <span class="node-label">${n.label}</span>`;
        } else {
          el.className = "node";
          el.innerHTML = `<img src="${n.ico}" alt="${n.label}">
      <span class="node-label">${n.label}</span>`;
        }
        diagramInner.appendChild(el);
      }

      // Event label — floating pill shown below EventBridge during relevant steps
      const eventLabelEl = document.createElement("div");
      eventLabelEl.className = "event-label";
      // Position centered below the EventBridge node
      const ebNode = nodes.find((n) => n.id === "eventbridge");
      // Center the label within the Event Bus boundary box, not the node itself
      const eventLabelX = eventBusBox.x + eventBusBox.w / 2;
      const eventLabelY = ebNode.y + NH;
      eventLabelEl.style.top = eventLabelY + "px";
      eventLabelEl.style.left = eventLabelX + "px";
      eventLabelEl.style.transform = "translateX(-50%)";
      diagramInner.appendChild(eventLabelEl);

      // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      // MANUAL STEP ENGINE
      // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

      let activeFlow = null;
      let stepIndex = -1;

      function clearHighlights() {
        document
          .querySelectorAll(".node.glow")
          .forEach((el) => el.classList.remove("glow"));
        document
          .querySelectorAll(".edge.glow")
          .forEach((el) => el.classList.remove("glow"));
        eventLabelEl.classList.remove("visible");
      }

      function clearAll() {
        clearHighlights();
        stepCounter.textContent = "";
        diagHints.style.opacity = "0";
        progressDots.innerHTML = "";
        logEntries.innerHTML =
          '<p class="log-empty">Selecteer een flow om te beginnen</p>';
      }

      function setColor(color) {
        document.documentElement.style.setProperty("--glow", color);
        document.documentElement.style.setProperty("--dot-color", color);
      }

      function buildDots(total, current) {
        progressDots.innerHTML = "";
        for (let i = 0; i < total; i++) {
          const d = document.createElement("div");
          d.className =
            "dot" + (i < current ? " done" : i === current ? " current" : "");
          progressDots.appendChild(d);
        }
      }

      // Rebuild the log panel from scratch up to (and including) targetIndex
      function rebuildLog(name, targetIndex, color) {
        const steps = flows[name];
        logEntries.innerHTML = "";
        for (let i = 0; i <= targetIndex; i++) {
          const step = steps[i];
          if (!step.label) continue;
          const entry = document.createElement("div");
          entry.className =
            "log-entry" + (i === targetIndex ? " current" : " past");
          entry.style.setProperty("--glow", color);
          entry.innerHTML = `<div class="log-text">${step.label}</div>`;
          logEntries.appendChild(entry);
        }
        // Auto-scroll to bottom
        logEntries.scrollTop = logEntries.scrollHeight;
      }

      // Apply a single step's highlights (does NOT clear — caller manages that)
      // isPulseStep: only pulse on the live render, never during history replay.
      function applyStepHighlights(name, index, isPulseStep = false) {
        const step = flows[name][index];
        if (!step) return;
        if (step.clear) clearHighlights();
        for (const nid of step.nodes || []) {
          const el = document.getElementById("node-" + nid);
          if (el) el.classList.add("glow");
        }
        for (const eid of step.edges || []) {
          const el = document.getElementById("edge-" + eid);
          if (el) el.classList.add("glow");
        }
        if (!isPulseStep) return;
        // Pulse elements that are already highlighted so there's a visible cue
        // even when nothing new is added to the diagram.
        for (const id of step.pulse || []) {
          const el =
            document.getElementById("node-" + id) ||
            document.getElementById("edge-" + id);
          if (!el) continue;
          el.classList.remove("pulse");
          void el.offsetWidth; // force reflow to restart the animation
          el.classList.add("pulse");
          setTimeout(() => el.classList.remove("pulse"), 700);
        }
      }

      // Replay all highlights from step 0 up to targetIndex
      function replayHighlights(name, targetIndex) {
        clearHighlights();
        for (let i = 0; i <= targetIndex; i++) {
          applyStepHighlights(name, i, false);
        }
      }

      function renderStep(name, index) {
        const steps = flows[name];
        const color = COLORS[name];

        replayHighlights(name, index);
        // Apply pulse for the current step only, after replay is done.
        applyStepHighlights(name, index, true);
        rebuildLog(name, index, color);

        // Show event label for the current step only
        const currentStep = steps[index];
        if (currentStep && currentStep.eventLabel) {
          eventLabelEl.textContent = currentStep.eventLabel;
          eventLabelEl.classList.add("visible");
        } else {
          eventLabelEl.classList.remove("visible");
        }

        const isLast = index === steps.length - 1;
        stepCounter.textContent = `${index + 1} / ${steps.length}`;
        buildDots(steps.length, index);
        diagHints.innerHTML = isLast
          ? "Esc &nbsp;reset &nbsp;|&nbsp; ← terug"
          : "Spatie / → &nbsp;volgende &nbsp;|&nbsp; ← terug &nbsp;|&nbsp; Esc reset";
        diagHints.style.opacity = "1";
      }

      function startFlow(name) {
        if (activeFlow === name) {
          // Toggle off / reset
          activeFlow = null;
          stepIndex = -1;
          document
            .querySelectorAll(".flow-btn")
            .forEach((b) => b.classList.remove("active"));
          clearAll();
          flowDesc.innerHTML = "&nbsp;";
          flowDesc.style.color = "rgba(255,255,255,0.35)";
          return;
        }

        activeFlow = name;
        stepIndex = 0;
        document
          .querySelectorAll(".flow-btn")
          .forEach((b) => b.classList.remove("active"));
        document.querySelector(".flow-btn." + name).classList.add("active");

        const color = COLORS[name];
        setColor(color);
        clearHighlights();
        diagram.classList.add("flow-active");

        flowDesc.textContent = DESCS[name];
        flowDesc.style.color = color;

        renderStep(name, 0);
      }

      function advance() {
        if (!activeFlow) return;
        const steps = flows[activeFlow];
        if (stepIndex >= steps.length - 1) return;
        stepIndex++;
        renderStep(activeFlow, stepIndex);
      }

      function goBack() {
        if (!activeFlow || stepIndex <= 0) return;
        stepIndex--;
        renderStep(activeFlow, stepIndex);
      }

      function reset() {
        if (activeFlow) startFlow(activeFlow); // toggles off
      }

      // Click diagram to advance
      diagram.addEventListener("click", advance);

      // Keyboard navigation
      document.addEventListener("keydown", (e) => {
        if (e.key === " " || e.key === "ArrowRight") {
          e.preventDefault();
          advance();
        } else if (e.key === "ArrowLeft") {
          e.preventDefault();
          goBack();
        } else if (e.key === "Escape") {
          reset();
        }
      });
